{% extends 'core/base.html' %}
{% block content %}
<div class="auth-container mx-auto" style="max-width:400px;">
  <h3 class="text-center mb-3">Login</h3>
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input name="username" class="form-control" required>
    </div>
    <div class="mb-3 position-relative">
      <label class="form-label">Password</label>
      <div class="input-group">
        <input name="password" id="password" type="password" class="form-control" required>
        <button type="button" class="btn btn-outline-secondary" id="toggleEye" onclick="togglePassword('password','toggleEyeIcon')">
          <span id="toggleEyeIcon">👁️</span>
        </button>
      </div>
    </div>
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3 text-center">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
</div>
{% endblock %}
